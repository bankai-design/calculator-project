<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div id="calculatorContainer">
        <div id="display"></div> <!-- for text -->

        <div id="digitsContainer">   
            <button id="butt seven">7</button>
            <button id="butt eight">8</button>
            <button id="butt nine">9</button>
            <button id="butt four">4</button>
            <button id="butt five">5</button>
            <button id="butt six">6</button>
            <button id="butt three">3</button>
            <button id="butt two">2</button>
            <button id="butt one">1</button>
            <button id="add">+</button>
            <button id="butt zero">0</button>
            <button id="subtract">-</button>
            <button id="multiply">*</button>
            <button id="divide">/</button>
            <button id="equal">=</button>
        </div>
    </div>
</body>
</html>
